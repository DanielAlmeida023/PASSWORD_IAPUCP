services:
  backend:
    build:
      context: .
      dockerfile: product_app/backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      # La data oficial de Kaggle (static.npz) NO se copia a la imagen: se monta en solo lectura
      # donde el backend la busca (ROOT_DIR/data = /workspace/data). Los pesos (models/) sí van en la imagen.
      - ./data:/workspace/data:ro
    restart: unless-stopped

  frontend:
    build:
      context: ./product_app/frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
